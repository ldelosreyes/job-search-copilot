name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: bun run --cwd api typecheck

      - name: Typecheck web
        run: bun run --cwd web typecheck

      - name: Build web
        run: bun run --cwd web build

      # Boots the API against a throwaway Postgres service container and
      # hits /health, so CI catches a broken server start (bad import,
      # missing env handling, etc.) before it ever reaches Vercel.
      - name: Smoke test API boot
        run: |
          bun run --cwd api src/index.ts &
          API_PID=$!

          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/health > /dev/null || {
            echo "API never became healthy"
            kill "$API_PID"
            exit 1
          }

          kill "$API_PID"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Only need to be *set* for llm-client.ts's fail-fast check to
          # pass — nothing in this smoke test calls Cerebras/Groq.
          CEREBRAS_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder

      # The test above runs under Bun, which is more lenient than Node
      # (e.g. it resolves extensionless relative imports, and provides
      # some browser globals Node doesn't). Vercel's Node.js Functions
      # runtime is stricter on both counts, which twice let bugs reach
      # production undetected — see WALKTHROUGH.md. Vercel's own builder
      # transpiles each file individually rather than running our tsc
      # config, but tsc's project build produces the same on-disk shape
      # (per-file .js output, import specifiers left untouched) so this
      # is an equivalent proxy, not the literal same tool. It invokes the
      # actual exported handler from api/index.ts directly, the same way
      # Vercel calls it, on the same Linux runner Vercel deploys to.
      - name: Smoke test API boot under Node.js (matches Vercel's runtime)
        run: bun run --cwd api smoke:node
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CEREBRAS_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
